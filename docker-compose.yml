version: "3.9"

# ─────────────────────────────────────────────────────────────
#  Airport Congestion Analytics — Infrastructure
#  Step 1: get all services healthy before writing any code
#  All secrets/config come from .env
# ─────────────────────────────────────────────────────────────

services:

  # ── Zookeeper ──────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | timeout 2 bash -c 'cat > /dev/tcp/localhost/2181' && echo imok"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # ── Kafka Broker ───────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"         # exposed to host for debugging / verify script
    environment:
      KAFKA_BROKER_ID: ${KAFKA_BROKER_ID}
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # we create topics explicitly
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_RETENTION_HOURS}
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 60000
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 15

  # ── Topic creation (one-shot init container) ───────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e

        echo "Creating topic: state_vectors"
        kafka-topics --bootstrap-server kafka:29092 \
          --create --if-not-exists \
          --topic state_vectors \
          --partitions 3 \
          --replication-factor 1 \
          --config retention.ms=7200000

        echo "Creating topic: registrations"
        kafka-topics --bootstrap-server kafka:29092 \
          --create --if-not-exists \
          --topic registrations \
          --partitions 1 \
          --replication-factor 1 \
          --config retention.ms=-1

        echo ""
        echo "All topics:"
        kafka-topics --bootstrap-server kafka:29092 --list

        echo ""
        echo "Topic details:"
        kafka-topics --bootstrap-server kafka:29092 \
          --describe --topic state_vectors
        kafka-topics --bootstrap-server kafka:29092 \
          --describe --topic registrations

        echo ""
        echo "kafka-init done."

  # ── Kafka Connect ──────────────────────────────────────────
  kafka-connect:
    image: confluentinc/cp-kafka-connect:7.6.0
    container_name: kafka-connect
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    volumes:
      - ./kafka-connect:/kafka-connect          # entrypoint.sh, *.json, kafka-connect-opensky/ all live here
      - ./data:/data                            # TSV files for FilePulse
      - ./kafka-connect/plugins:/etc/kafka-connect/plugins  # extra JARs if needed
    entrypoint: ["/bin/bash", "/kafka-connect/entrypoint.sh"]
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:29092
      CONNECT_REST_PORT: 8083
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_GROUP_ID: airport-connect-group
      CONNECT_CONFIG_STORAGE_TOPIC:  _connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC:  _connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC:  _connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER:   org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE:   "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components,/etc/kafka-connect/plugins
      CONNECT_LOG4J_ROOT_LOGLEVEL: WARN
      # OpenSky connector config (used in source_state_vectors.json)
      OPENSKY_API_BBOX: "${BBOX_LAMIN} ${BBOX_LAMAX} ${BBOX_LOMIN} ${BBOX_LOMAX}"
      OPENSKY_API_INTERVAL: "15"
      OPENSKY_API_URL: "https://opensky-network.org/api/"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8083/connectors"]
      interval: 15s
      timeout: 10s
      retries: 15

  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d   # *.sql run on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── pgAdmin ────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}

  # ── Grafana ────────────────────────────────────────────────
  grafana:
    image: grafana/grafana-oss:10.4.2
    container_name: grafana
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # Consumed by grafana/provisioning/datasources/postgres.yml
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning

  # ── Flink JobManager ──────────────────────────────────────
  # All three Flink services build from the SAME image (flink/Dockerfile),
  # exactly like the lab. The image bundles Flink + PyFlink + our deps.
  flink-jobmanager:
    build:
      context: ./flink
      dockerfile: Dockerfile
    image: airport-pyflink:latest          # build once, reuse for the other two
    container_name: flink-jobmanager
    restart: unless-stopped
    ports:
      - "8081:8081"       # Flink Web UI + job submission REST endpoint
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.bind-address: 0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/overview"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ── Flink TaskManager ─────────────────────────────────────
  flink-taskmanager:
    build:
      context: ./flink
      dockerfile: Dockerfile
    image: airport-pyflink:latest          # same tag/context -> built from cache, instant
    container_name: flink-taskmanager
    restart: unless-stopped
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2

  # ── PyFlink Job (submitter) ───────────────────────────────
  # Uses the image's default CMD: `flink run -m flink-jobmanager:8081 ...`.
  # Submits the job to the session cluster, then exits (the job keeps running
  # on the cluster). flink_job.py also calls wait_for_topics() so it blocks
  # until state_vectors exists.
  flink-job:
    build:
      context: ./flink
      dockerfile: Dockerfile
    image: airport-pyflink:latest          # same tag/context -> built from cache, instant
    container_name: flink-job
    restart: on-failure
    depends_on:
      flink-jobmanager:
        condition: service_healthy
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      PROCESSOR_JOBMANAGER:   flink-jobmanager:8081
      PROCESSOR_IMPLEMENTATION: flink_job.py
      # Captured at submit time and serialised into the job graph:
      KAFKA_BOOTSTRAP:   kafka:29092
      POSTGRES_HOST:     postgres
      POSTGRES_PORT:     5432
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

volumes:
  postgres_data:
  grafana_data:
